name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  website:
    name: Website (lint/type/test/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  security:
    name: Security (secret/dep scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --results=verified,unknown
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: Trivy

  build:
    name: Build & publish image
    runs-on: ubuntu-latest
    needs: [website]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # amd64 (loudnova x86_64) and arm64 (hetzner-dr Ampere) from one immutable tag.
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_GA_MEASUREMENT_ID=G-NS75TXH0CQ
            NEXT_PUBLIC_SITE_URL=https://paymentops.cloudnova.tech
            NEXT_PUBLIC_APP_URL=https://paymentops-app.cloudnova.tech
          tags: ghcr.io/cloodnova/paymentops-website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/cloodnova/paymentops-website:${{ github.sha }}
          format: spdx-json
          output-file: sbom-website.syft.json
